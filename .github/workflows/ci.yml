
name: UptimeForge CI

on:
  push:
    branches:
      - feat/devops-foundation

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version
      - name: install dependencies
        working-directory: ./app
        run: python -m pip install -e  '.[dev]'

      - name: Run ruff
        working-directory: ./app
        run: ruff check .

      - name: Run pytest
        working-directory: ./app
        run: pytest -q

      - name: Build Docker image
        working-directory: ./app
        run: docker build -f Dockerfile -t uptimeforge-api:ci .