
name: UptimeForge CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - feat/aws-networking

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Application tests and container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: uptimeforge
          POSTGRES_PASSWORD: ci_test_password_2026
          POSTGRES_DB: uptimeforge_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U uptimeforge -d uptimeforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.lock

      - name: Verify Python
        run: python --version
      
      - name: install dependencies
        working-directory: ./app
        run: python -m pip install -c requirements.lock -e '.[dev]'
     
      
      - name: Run Alembic migrations
        working-directory: ./app
        env:
          DATABASE_URL: postgresql+psycopg://uptimeforge:ci_test_password_2026@127.0.0.1:5432/uptimeforge_test
          AUTH_USERNAME: ci-admin
          AUTH_PASSWORD: ci_only_password_12345
        run: alembic upgrade head

      - name: Run ruff
        working-directory: ./app
        run: ruff check .

      -  name: Run pytest
         working-directory: ./app
         env:
           UPTIMEFORGE_TEST_DATABASE_URL: postgresql+psycopg://uptimeforge:ci_test_password_2026@127.0.0.1:5432/uptimeforge_test
         run: pytest -q -rs

      - name: Build Docker image
        working-directory: ./app
        run: docker build -f Dockerfile -t uptimeforge-api:ci .
      - name: Validate production Compose contract
        env:
          APP_IMAGE: 152680102458.dkr.ecr.eu-north-1.amazonaws.com/uptimeforge-api:sha-0000000000000000000000000000000000000000
          DOCKER_HOST_PRIVATE_IP: 10.20.2.23
          POSTGRES_VOLUME_NAME: validation-only
          POSTGRES_DB: uptimeforge_test
          POSTGRES_USER: uptimeforge
          POSTGRES_PASSWORD: synthetic_compose_test_password
          DATABASE_URL: postgresql+psycopg://uptimeforge:synthetic_compose_test_password@db:5432/uptimeforge_test
          AUTH_USERNAME: ci-admin
          AUTH_PASSWORD: synthetic_compose_test_password
        run: docker compose -f compose.prod.yaml --profile tools config --format json | python scripts/validate-production-compose.py
